<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Flipping Simulator</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #ffffff;
            --accent: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 15px 25px;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .balance { font-size: 1.5rem; font-weight: bold; }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s opacity;
        }
        button:hover { opacity: 0.8; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .car-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s all;
        }
        .car-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .car-card h3 { margin: 0 0 10px 0; }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .badge.cheap { background: #747d8c; }
        .badge.normal { background: #3742fa; }
        .badge.luxury { background: #ffa502; color: #000; }
        
        .action-area {
            background: var(--panel);
            padding: 30px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-sell { background: var(--success); }
        .btn-fix { background: var(--warning); color: #000; }
        
        #message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
        .msg-win { background: rgba(46, 213, 115, 0.2); color: var(--success); border: 1px solid var(--success); }
        .msg-lose { background: rgba(255, 71, 87, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="balance">Coins: <span id="balanceDisplay">10000</span></div>
        <button onclick="topUp()">+ Top Up 5000</button>
    </header>

    <div class="container">
        <h2 id="phaseTitle">Select a Car to Flip</h2>
        
        <div class="car-grid" id="carGrid">
            <!-- Cars injected via JS -->
        </div>

        <div class="action-area" id="actionArea">
            <h2 id="selectedCarName">Car Name</h2>
            <p id="selectedCarDetails"></p>
            <div class="action-buttons">
                <button class="btn-fix" id="btnFix" onclick="fixCar()">Fix Car</button>
                <button class="btn-sell" id="btnSell" onclick="sellCar()">Sell "As Is"</button>
                <button onclick="startRound()" style="background: #555;">Cancel</button>
            </div>
        </div>

        <div id="message-box"></div>
        <button id="btnNextRound" onclick="startRound()" style="display:none; margin: 20px auto;">Play Next Round</button>
    </div>

    <script>
        // Fleet Data
        const fleet = [
            { name: "Rusted Civic", tier: "cheap", basePrice: 200 },
            { name: "Beat-up Corolla", tier: "cheap", basePrice: 300 },
            { name: "Old Golf", tier: "cheap", basePrice: 400 },
            { name: "Dented Fiesta", tier: "cheap", basePrice: 250 },
            { name: "Rusty Lada", tier: "cheap", basePrice: 150 },
            { name: "Scrap Twingo", tier: "cheap", basePrice: 100 },
            { name: "Used Camry", tier: "normal", basePrice: 2500 },
            { name: "Decent Accord", tier: "normal", basePrice: 3000 },
            { name: "Clean Passat", tier: "normal", basePrice: 3500 },
            { name: "Modern Mazda 3", tier: "normal", basePrice: 4000 },
            { name: "Ford Focus", tier: "normal", basePrice: 2000 },
            { name: "Subaru Impreza", tier: "normal", basePrice: 4500 },
            { name: "G-Wagon", tier: "luxury", basePrice: 30000 },
            { name: "Ferrari 458", tier: "luxury", basePrice: 45000 },
            { name: "Lambo Huracan", tier: "luxury", basePrice: 50000 },
            { name: "Porsche 911", tier: "luxury", basePrice: 25000 },
            { name: "Rolls Royce", tier: "luxury", basePrice: 60000 },
            { name: "McLaren 720S", tier: "luxury", basePrice: 55000 }
        ];

        const conditions = ["Wrecked", "Normal wear", "Mint"];
        const demandStats = {
            1: { name: "Low", winChance: 0.30, multiplier: 3.20 },
            2: { name: "Medium", winChance: 0.60, multiplier: 1.60 },
            3: { name: "High", winChance: 0.85, multiplier: 1.13 }
        };

        let balance = 10000;
        let currentOffers = [];
        let activeCar = null;

        function updateBalance() {
            document.getElementById("balanceDisplay").innerText = Math.floor(balance);
        }

        function topUp() {
            balance += 5000;
            updateBalance();
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function startRound() {
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("message-box").style.display = "none";
            document.getElementById("btnNextRound").style.display = "none";
            document.getElementById("carGrid").style.display = "grid";
            document.getElementById("phaseTitle").innerText = "Select a Car to Flip";
            
            currentOffers = [];
            let gridHTML = "";

            for (let i = 0; i < 3; i++) {
                let carTemplate = fleet[randomInt(0, fleet.length - 1)];
                let condition = conditions[randomInt(0, 2)];
                let demandLevel = randomInt(1, 3);
                
                // Adjust price slightly based on condition
                let priceMod = condition === "Wrecked" ? 0.7 : (condition === "Mint" ? 1.3 : 1.0);
                let finalPrice = Math.floor(carTemplate.basePrice * priceMod);

                let car = {
                    ...carTemplate,
                    price: finalPrice,
                    condition: condition,
                    demandLevel: demandLevel,
                    invested: finalPrice
                };
                currentOffers.push(car);

                gridHTML += `
                    <div class="car-card" onclick="selectCar(${i})">
                        <span class="badge ${car.tier}">${car.tier.toUpperCase()}</span>
                        <h3>${car.name}</h3>
                        <p><strong>Condition:</strong> ${car.condition}</p>
                        <p><strong>Demand:</strong> ${demandStats[car.demandLevel].name}</p>
                        <p><strong>Price:</strong> ${car.price} Coins</p>
                        <p><strong>Potential Win:</strong> ${Math.floor(car.price * demandStats[car.demandLevel].multiplier)} Coins</p>
                    </div>
                `;
            }
            document.getElementById("carGrid").innerHTML = gridHTML;
        }

        function selectCar(index) {
            activeCar = currentOffers[index];
            if (balance < activeCar.price) {
                alert("Not enough coins! Please top up.");
                return;
            }

            balance -= activeCar.price;
            updateBalance();

            document.getElementById("carGrid").style.display = "none";
            document.getElementById("actionArea").style.display = "block";
            document.getElementById("phaseTitle").innerText = "Action Phase";
            
            updateActionArea();
        }

        function updateActionArea() {
            document.getElementById("selectedCarName").innerText = activeCar.name;
            let dStats = demandStats[activeCar.demandLevel];
            
            let fixCost = 0;
            let canFix = false;

            if (activeCar.condition === "Wrecked") {
                fixCost = Math.floor(activeCar.price * 0.50);
                canFix = true;
            } else if (activeCar.condition === "Normal wear") {
                fixCost = Math.floor(activeCar.price * 0.25);
                canFix = true;
            }

            document.getElementById("selectedCarDetails").innerHTML = `
                <p><strong>Total Invested:</strong> ${activeCar.invested} Coins</p>
                <p><strong>Condition:</strong> ${activeCar.condition}</p>
                <p><strong>Current Demand:</strong> ${dStats.name} (Risk of Impound: ${Math.round((1 - dStats.winChance) * 100)}%)</p>
                <p><strong>Payout Multiplier:</strong> ${dStats.multiplier}x</p>
                <p><strong>Win Amount:</strong> ${Math.floor(activeCar.invested * dStats.multiplier)} Coins</p>
            `;

            let btnFix = document.getElementById("btnFix");
            let btnSell = document.getElementById("btnSell");

            if (canFix && activeCar.demandLevel < 3) {
                btnFix.style.display = "inline-block";
                btnFix.innerText = `Fix Car (-${fixCost} Coins)`;
                btnFix.disabled = balance < fixCost;
                btnSell.innerText = `Sell "As Is"`;
            } else {
                btnFix.style.display = "none";
                btnSell.innerText = `Sell Car`;
            }
        }

        function fixCar() {
            let fixCost = 0;
            let demandIncrease = 0;

            if (activeCar.condition === "Wrecked") {
                fixCost = Math.floor(activeCar.price * 0.50);
                demandIncrease = 2;
            } else if (activeCar.condition === "Normal wear") {
                fixCost = Math.floor(activeCar.price * 0.25);
                demandIncrease = 1;
            }

            if (balance < fixCost) {
                alert("Not enough coins to fix!");
                return;
            }

            balance -= fixCost;
            activeCar.invested += fixCost;
            activeCar.condition = "Mint"; // Car is now fixed
            activeCar.demandLevel = Math.min(3, activeCar.demandLevel + demandIncrease);
            
            updateBalance();
            updateActionArea();
        }

        function sellCar() {
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("phaseTitle").innerText = "Result";
            
            let dStats = demandStats[activeCar.demandLevel];
            let roll = Math.random(); // Generates 0.0 to 1.0
            
            let msgBox = document.getElementById("message-box");
            msgBox.style.display = "block";

            if (roll <= dStats.winChance) {
                // Win
                let winnings = Math.floor(activeCar.invested * dStats.multiplier);
                balance += winnings;
                msgBox.className = "msg-win";
                msgBox.innerHTML = `🎉 Congratulations! You successfully flipped the ${activeCar.name}.<br>It sold for <strong>${winnings} Coins!</strong>`;
            } else {
                // Lose (Impounded)
                msgBox.className = "msg-lose";
                msgBox.innerHTML = `🚓 Busted! The ${activeCar.name} was impounded due to sketchy paperwork.<br>You lost your investment of <strong>${activeCar.invested} Coins.</strong>`;
            }

            updateBalance();
            document.getElementById("btnNextRound").style.display = "block";
        }

        // Initialize game on load
        startRound();
    </script>
</body>
</html>
