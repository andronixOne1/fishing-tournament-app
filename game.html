<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Flipping Simulator - 8-Bit Edition</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --text: #c5c6c7;
            --accent: #66fcf1;
            --accent-dark: #45a29e;
            --lose: #ff4757;
            --win: #2ed573;
            --gold: #ffd700;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 15px 25px;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--accent-dark);
        }
        .balance { font-size: 1.5rem; font-weight: bold; color: white; }
        .balance span { color: var(--accent); }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s all;
            text-transform: uppercase;
        }
        button:hover { transform: scale(1.05); background: #fff; }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; transform: none; border:none; }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        h2 { color: white; }
        
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .car-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #333;
            cursor: pointer;
            transition: 0.2s all;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .car-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(102, 252, 241, 0.2); }
        .car-card h3 { margin: 10px 0 5px 0; color: white; }
        
        .car-icon-container {
            width: 120px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #333;
        }

        .tier-badge {
            position: absolute;
            top: 0; right: 0;
            padding: 5px 15px;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom-left-radius: 12px;
            text-transform: uppercase;
        }
        .tier-cheap { background: #747d8c; color: white; }
        .tier-normal { background: #3742fa; color: white; }
        .tier-luxury { background: var(--gold); color: black; }

        .pot-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 10px 0;
            border: 1px solid currentColor;
        }
        .pot-0 { color: #a4b0be; } 
        .pot-1 { color: #3498db; } 
        .pot-2 { color: #9b59b6; } 
        .pot-3 { color: #ff4757; text-shadow: 0 0 8px rgba(255,71,87,0.5); font-weight: 900;}

        .action-area {
            background: var(--panel);
            padding: 30px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            border: 1px solid #444;
            position: relative;
        }
        .action-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .btn-sell { background: var(--win); color: white; }
        .btn-fix { background: var(--gold); color: black; }
        .btn-cancel { background: transparent; border: 1px solid #555; color: #ccc; }
        .btn-cancel:hover { background: #333; }

        /* Progress Bar Styling */
        .progress-container {
            width: 80%;
            max-width: 320px;
            height: 14px;
            background: #111;
            border: 1px solid #444;
            border-radius: 10px;
            margin: 15px auto;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent);
        }
        .progress-bar.gold {
            background: linear-gradient(90deg, #ffa502, var(--gold));
            box-shadow: 0 0 10px var(--gold);
        }

        #overlay-loader {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(31, 40, 51, 0.95);
            border-radius: 12px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        #repair-result-banner {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease-in-out;
        }
        .repair-fail { background: rgba(255, 71, 87, 0.2); border: 1px solid var(--lose); color: var(--lose); }
        .repair-shoddy { background: rgba(255, 165, 2, 0.2); border: 1px solid #ffa502; color: #ffa502; }
        .repair-success { background: rgba(46, 213, 115, 0.2); border: 1px solid var(--win); color: var(--win); }
        .repair-jackpot { background: rgba(255, 215, 0, 0.2); border: 1px solid var(--gold); color: var(--gold); text-shadow: 0 0 5px rgba(255,215,0,0.5); }

        #result-area {
            display: none;
            margin-top: 40px;
            padding: 40px 20px;
            background: radial-gradient(circle, var(--panel) 0%, var(--bg) 100%);
            border-radius: 16px;
            border: 1px
