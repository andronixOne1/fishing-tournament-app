<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Flipping Simulator - High Stakes</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --text: #c5c6c7;
            --accent: #66fcf1;
            --accent-dark: #45a29e;
            --lose: #ff4757;
            --win: #2ed573;
            --gold: #ffd700;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 15px 25px;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--accent-dark);
        }
        .balance { font-size: 1.5rem; font-weight: bold; color: white; }
        .balance span { color: var(--accent); }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s all;
            text-transform: uppercase;
        }
        button:hover { transform: scale(1.05); background: #fff; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        h2 { color: white; }
        
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .car-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #333;
            cursor: pointer;
            transition: 0.2s all;
            position: relative;
            overflow: hidden;
        }
        .car-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(102, 252, 241, 0.2); }
        .car-card h3 { margin: 10px 0; color: white; }
        
        .tier-badge {
            position: absolute;
            top: 0; right: 0;
            padding: 5px 15px;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom-left-radius: 12px;
            text-transform: uppercase;
        }
        .tier-cheap { background: #747d8c; color: white; }
        .tier-normal { background: #3742fa; color: white; }
        .tier-luxury { background: var(--gold); color: black; }

        .pot-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 10px 0;
            border: 1px solid currentColor;
        }
        .pot-0 { color: #a4b0be; } /* Normal */
        .pot-1 { color: #3498db; } /* Big */
        .pot-2 { color: #9b59b6; } /* Huge */
        .pot-3 { color: #ff4757; text-shadow: 0 0 8px rgba(255,71,87,0.5); font-weight: 900;} /* Insane */

        .action-area {
            background: var(--panel);
            padding: 30px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            border: 1px solid #444;
        }
        .action-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .btn-sell { background: var(--win); color: white; }
        .btn-fix { background: var(--gold); color: black; }
        .btn-cancel { background: transparent; border: 1px solid #555; color: #ccc; }
        .btn-cancel:hover { background: #333; }

        /* Suspense & Results Area */
        #result-area {
            display: none;
            margin-top: 40px;
            padding: 40px 20px;
            background: radial-gradient(circle, var(--panel) 0%, var(--bg) 100%);
            border-radius: 16px;
            border: 1px solid #333;
        }
        .status-text {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .multiplier-display {
            font-size: 5rem;
            font-weight: 900;
            color: white;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .multiplier-display.crashed { color: var(--lose); text-shadow: 0 0 20px rgba(255,71,87,0.4); }
        .multiplier-display.won { color: var(--win); text-shadow: 0 0 30px rgba(46,213,115,0.6); transform: scale(1.1); transition: 0.3s transform cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .coins-won {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            height: 24px;
        }
        .coins-won span { color: var(--gold); font-weight: bold; }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .pulsing { animation: pulse 1s infinite; }
    </style>
</head>
<body>

    <header>
        <div class="balance">Balance: $<span id="balanceDisplay">10,000</span></div>
        <button onclick="topUp()">Deposit $5,000</button>
    </header>

    <div class="container">
        <h2 id="phaseTitle">Select a Car to Flip</h2>
        
        <div class="car-grid" id="carGrid">
            <!-- Cars injected via JS -->
        </div>

        <div class="action-area" id="actionArea">
            <h2 id="selectedCarName" style="margin-top:0;">Car Name</h2>
            <div id="selectedCarDetails" style="font-size: 1.1rem; line-height: 1.6;"></div>
            <div class="action-buttons">
                <button class="btn-fix" id="btnFix" onclick="fixCar()">Fix Car</button>
                <button class="btn-sell" id="btnSell" onclick="startSellPhase()">Sell As Is</button>
                <button class="btn-cancel" onclick="startRound()">Cancel</button>
            </div>
        </div>

        <div id="result-area">
            <div class="status-text pulsing" id="statusText">Finding a buyer...</div>
            <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
            <div class="coins-won" id="coinsWonDisplay"></div>
            <button id="btnNextRound" onclick="startRound()" style="display:none; margin: 0 auto;">Play Next Round</button>
        </div>
    </div>

    <script>
        // Data Structure
        const fleet = [
            { name: "Rusted Civic", tier: "cheap", basePrice: 200 },
            { name: "Old Golf", tier: "cheap", basePrice: 400 },
            { name: "Scrap Twingo", tier: "cheap", basePrice: 100 },
            { name: "Used Camry", tier: "normal", basePrice: 2500 },
            { name: "Decent Accord", tier: "normal", basePrice: 3000 },
            { name: "Clean Passat", tier: "normal", basePrice: 3500 },
            { name: "G-Wagon", tier: "luxury", basePrice: 30000 },
            { name: "Ferrari 458", tier: "luxury", basePrice: 45000 },
            { name: "Lambo Huracan", tier: "luxury", basePrice: 50000 }
        ];

        const conditions = ["Wrecked", "Normal wear", "Mint"];
        
        // Multiplier Pools designed for ~96% RTP
        const potentialTiers = [
            { id: 0, name: "Normal Win", class: "pot-0", winChance: 0.60, pool: [{m: 1.1, c: 60}, {m: 2, c: 35}, {m: 5, c: 5}] },
            { id: 1, name: "Big Win", class: "pot-1", winChance: 0.40, pool: [{m: 1.2, c: 80}, {m: 3, c: 12}, {m: 10, c: 6}, {m: 25, c: 2}] },
            { id: 2, name: "Huge Win", class: "pot-2", winChance: 0.25, pool: [{m: 1.2, c: 84}, {m: 5, c: 10}, {m: 25, c: 5}, {m: 100, c: 1}] },
            { id: 3, name: "INSANE WIN", class: "pot-3", winChance: 0.10, pool: [{m: 1.2, c: 88}, {m: 10, c: 9}, {m: 100, c: 2.5}, {m: 1000, c: 0.5}] }
        ];

        let balance = 10000;
        let currentOffers = [];
        let activeCar = null;

        function updateBalance() {
            document.getElementById("balanceDisplay").innerText = balance.toLocaleString();
        }

        function topUp() {
            balance += 5000;
            updateBalance();
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatCurrency(num) {
            return "$" + num.toLocaleString();
        }

        function startRound() {
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("carGrid").style.display = "grid";
            document.getElementById("phaseTitle").style.display = "block";
            document.getElementById("phaseTitle").innerText = "Select a Car to Flip";
            
            currentOffers = [];
            let gridHTML = "";

            for (let i = 0; i < 3; i++) {
                let carTemplate = fleet[randomInt(0, fleet.length - 1)];
                let condition = conditions[randomInt(0, 2)];
                
                // Base potential is tied to condition: Wrecked = 0, Normal = 1, Mint = 2. 
                // We add slight randomness so a minted car might occasionally spawn with "Insane" potential.
                let baseTier = condition === "Wrecked" ? 0 : (condition === "Normal wear" ? 1 : 2);
                let finalTier = Math.min(3, Math.max(0, baseTier + randomInt(-1, 1)));

                let priceMod = condition === "Wrecked" ? 0.6 : (condition === "Mint" ? 1.4 : 1.0);
                let finalPrice = Math.floor(carTemplate.basePrice * priceMod);

                let car = {
                    ...carTemplate,
                    price: finalPrice,
                    condition: condition,
                    tierLevel: finalTier,
                    invested: finalPrice
                };
                currentOffers.push(car);

                let pTier = potentialTiers[car.tierLevel];

                gridHTML += `
                    <div class="car-card" onclick="selectCar(${i})">
                        <div class="tier-badge tier-${car.tier}">Class: ${car.tier}</div>
                        <h3>${car.name}</h3>
                        <p style="color:#aaa; margin:5px 0;">Condition: <span style="color:white;">${car.condition}</span></p>
                        <p style="color:#aaa; margin:5px 0;">Price: <span style="color:white;">${formatCurrency(car.price)}</span></p>
                        <div class="pot-badge ${pTier.class}">Potential: ${pTier.name}</div>
                    </div>
                `;
            }
            document.getElementById("carGrid").innerHTML = gridHTML;
        }

        function selectCar(index) {
            activeCar = currentOffers[index];
            if (balance < activeCar.price) {
                alert("Insufficient balance. Please deposit funds.");
                return;
            }

            balance -= activeCar.price;
            updateBalance();

            document.getElementById("carGrid").style.display = "none";
            document.getElementById("actionArea").style.display = "block";
            document.getElementById("phaseTitle").style.display = "none";
            
            updateActionArea();
        }

        function updateActionArea() {
            document.getElementById("selectedCarName").innerText = activeCar.name;
            let pTier = potentialTiers[activeCar.tierLevel];
            
            let fixCost = 0;
            let tierJump = 0;
            let canFix = false;

            if (activeCar.condition === "Wrecked") {
                fixCost = activeCar.price; // 100% cost
                tierJump = 2;
                canFix = true;
            } else if (activeCar.condition === "Normal wear") {
                fixCost = Math.floor(activeCar.price * 0.50); // 50% cost
                tierJump = 1;
                canFix = true;
            }

            let nextTierLevel = Math.min(3, activeCar.tierLevel + tierJump);
            let nextTier = potentialTiers[nextTierLevel];

            let html = `
                <p>Initial Investment: <strong>${formatCurrency(activeCar.invested)}</strong></p>
                <p>Condition: <strong>${activeCar.condition}</strong></p>
                <div class="pot-badge ${pTier.class}" style="font-size:1.2rem;">Current Potential: ${pTier.name}</div>
            `;

            if (canFix && activeCar.tierLevel < 3) {
                html += `
                    <div style="background: rgba(255,215,0,0.1); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed var(--gold);">
                        <p style="margin:0 0 10px 0; color: var(--gold);"><strong>Repair Shop Offer:</strong></p>
                        <p style="margin:0; font-size: 0.95rem;">Invest ${formatCurrency(fixCost)} to upgrade potential to <span class="${nextTier.class}"><strong>${nextTier.name}</strong></span>!</p>
                    </div>
                `;
                document.getElementById("btnFix").style.display = "inline-block";
                document.getElementById("btnFix").innerText = `Fix Car (-${formatCurrency(fixCost)})`;
                document.getElementById("btnFix").disabled = balance < fixCost;
                document.getElementById("btnSell").innerText = `Sell As Is`;
            } else {
                document.getElementById("btnFix").style.display = "none";
                document.getElementById("btnSell").innerText = `Sell Car`;
            }

            document.getElementById("selectedCarDetails").innerHTML = html;
        }

        function fixCar() {
            let fixCost = 0;
            let tierJump = 0;

            if (activeCar.condition === "Wrecked") {
                fixCost = activeCar.price;
                tierJump = 2;
            } else if (activeCar.condition === "Normal wear") {
                fixCost = Math.floor(activeCar.price * 0.50);
                tierJump = 1;
            }

            if (balance < fixCost) return;

            balance -= fixCost;
            activeCar.invested += fixCost;
            activeCar.condition = "Mint"; 
            activeCar.tierLevel = Math.min(3, activeCar.tierLevel + tierJump);
            
            updateBalance();
            updateActionArea();
        }

        // Logic to determine the final multiplier based on exact RTP weights
        function rollMultiplier(tier) {
            let roll = Math.random();
            if (roll > tier.winChance) return 0; // Impounded / Lost

            // Passed the win check, now select multiplier from pool
            let multRoll = Math.random() * 100;
            let cumulative = 0;
            for (let i = 0; i < tier.pool.length; i++) {
                cumulative += tier.pool[i].c;
                if (multRoll <= cumulative) {
                    return tier.pool[i].m;
                }
            }
            return tier.pool[tier.pool.length - 1].m; // Fallback to max
        }

        function startSellPhase() {
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            
            let statusEl = document.getElementById("statusText");
            let multEl = document.getElementById("multiplierDisplay");
            let coinsEl = document.getElementById("coinsWonDisplay");
            let nextBtn = document.getElementById("btnNextRound");

            // Reset UI
            statusEl.innerText = "Finding a buyer...";
            statusEl.className = "status-text pulsing";
            multEl.innerText = "1.00x";
            multEl.className = "multiplier-display";
            coinsEl.innerHTML = "";
            nextBtn.style.display = "none";

            let pTier = potentialTiers[activeCar.tierLevel];
            let finalMult = rollMultiplier(pTier);

            // Artificial delay to build suspense before ticking
            setTimeout(() => {
                if (finalMult === 0) {
                    // Instant crash/impound
                    statusEl.innerText = "Busted! Car Impounded.";
                    statusEl.classList.remove("pulsing");
                    multEl.innerText = "0.00x";
                    multEl.classList.add("crashed");
                    coinsEl.innerHTML = `Total Loss: <span>-${formatCurrency(activeCar.invested)}</span>`;
                    nextBtn.style.display = "block";
                } else {
                    // Win! Start ticking animation
                    statusEl.innerText = "Buyer found! Negotiating...";
                    animateMultiplier(finalMult, activeCar.invested);
                }
            }, 1000);
        }

        function animateMultiplier(targetMult, invested) {
            let multEl = document.getElementById("multiplierDisplay");
            let statusEl = document.getElementById("statusText");
            let coinsEl = document.getElementById("coinsWonDisplay");
            let nextBtn = document.getElementById("btnNextRound");
            
            let currentMult = 1.00;
            // The larger the target, the faster the steps so it always takes ~2.5 seconds
            let step = (targetMult - 1.00) / (60 * 2.5); 
            if (step < 0.01) step = 0.01;

            function tick() {
                currentMult += step;
                if (currentMult >= targetMult) {
                    currentMult = targetMult;
                    
                    // Final State
                    multEl.innerText = currentMult.toFixed(2) + "x";
                    multEl.classList.add("won");
                    statusEl.innerText = "SOLD!";
                    statusEl.style.color = "var(--win)";
                    statusEl.classList.remove("pulsing");
                    
                    let winnings = Math.floor(invested * currentMult);
                    balance += winnings;
                    updateBalance();
                    
                    coinsEl.innerHTML = `You won <span>${formatCurrency(winnings)}</span>!`;
                    nextBtn.style.display = "block";
                    return;
                }
                
                multEl.innerText = currentMult.toFixed(2) + "x";
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        // Initialize game on load
        startRound();
    </script>
</body>
</html>
