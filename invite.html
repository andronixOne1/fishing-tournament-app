<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ანდროს დაბადების დღე 🎂</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            /* Happy / Couple Theme (Default) */
            --primary-color: #6eb5ff; 
            --secondary-color: #ffda75; 
            --bg-gradient: linear-gradient(135deg, #fff9d2 0%, #d4f0ff 100%); 
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-color: #555555;
            --heading-color: #6eb5ff;
            --subheading-color: #ffc233;
            --border-dash: #ffeda3;
            --input-bg: #f7fcff;
            --input-border: #e6f4ff;
            --input-text: #333333;
            --banner-bg: #fffde6;
            --banner-border: #fff3a3;
            --banner-text: #d69e00;
            --card-inner-bg: #ffffff;
            --card-border: #f0f0f0;
            --card-heading: #444444;
            --card-text: #666666;
            --card-checked-bg: #f2faff;
            --card-checked-shadow: rgba(110, 181, 255, 0.25);
            --toggle-bg: #f0f8ff;
            --toggle-border: #d4f0ff;
            --toggle-text: #888888;
            --toggle-checked-bg: #ffffff;
            --btn-bg: #6eb5ff;
            --btn-hover: #5baaff;
            --btn-text: #ffffff;
        }

        /* Sad / Solo Theme */
        body.solo-theme {
            --primary-color: #888888;
            --secondary-color: #555555;
            --bg-gradient: linear-gradient(135deg, #1c1c1c 0%, #2d2d2d 100%);
            --card-bg: rgba(30, 30, 30, 0.95);
            --text-color: #aaaaaa;
            --heading-color: #aaaaaa;
            --subheading-color: #777777;
            --border-dash: #444444;
            --input-bg: #2a2a2a;
            --input-border: #444444;
            --input-text: #eeeeee;
            --banner-bg: #222222;
            --banner-border: #444444;
            --banner-text: #888888;
            --card-inner-bg: #222222;
            --card-border: #444444;
            --card-heading: #dddddd;
            --card-text: #999999;
            --card-checked-bg: #3a3a3a;
            --card-checked-shadow: rgba(0, 0, 0, 0.5);
            --toggle-bg: #1a1a1a;
            --toggle-border: #333333;
            --toggle-text: #555555;
            --toggle-checked-bg: #444444;
            --btn-bg: #444444;
            --btn-hover: #555555;
            --btn-text: #cccccc;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.6s ease;
        }

        .gif-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 420px;
            pointer-events: none;
            z-index: 10;
        }

        .header-gifs { margin-bottom: -15px; }
        .footer-gifs { margin-top: -15px; }

        .gif-wrapper img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
            transition: opacity 0.3s ease; /* smooth transition when swapping src */
        }

        .gif-wrapper img:nth-child(even) {
            animation-delay: 1.5s;
            animation-direction: reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .container {
            background-color: var(--card-bg);
            max-width: 420px;
            width: 100%;
            padding: 30px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 3px solid var(--card-inner-bg);
            position: relative;
            z-index: 20;
            box-sizing: border-box;
            transition: all 0.6s ease;
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            color: var(--heading-color);
            margin-bottom: 20px;
            margin-top: 5px;
            line-height: 1.4;
            transition: color 0.6s ease;
        }

        .toggle-container {
            display: flex;
            background-color: var(--toggle-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--toggle-border);
            margin-bottom: 20px;
            transition: all 0.6s ease;
        }

        .toggle-container label {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            color: var(--toggle-text);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-container input[type="radio"] {
            display: none;
        }

        .toggle-container input[type="radio"]:checked + span {
            color: var(--primary-color);
        }
        
        .toggle-container label:has(input[type="radio"]:checked) {
            background-color: var(--toggle-checked-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h3 {
            font-size: 16px;
            font-weight: 900;
            margin-top: 20px;
            margin-bottom: 12px;
            color: var(--subheading-color);
            padding-bottom: 5px;
            border-bottom: 2px dashed var(--border-dash);
            transition: all 0.6s ease;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 15px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            background-color: var(--card-inner-bg);
        }

        input::placeholder {
            color: #888;
        }

        #guest2_section {
            transition: opacity 0.4s ease, max-height 0.4s ease;
            max-height: 200px;
            opacity: 1;
            overflow: hidden;
        }

        #guest2_section.hidden {
            max-height: 0;
            opacity: 0;
            margin: 0;
        }

        .hotel-banner {
            background-color: var(--banner-bg);
            border: 2px solid var(--banner-border);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
            transition: all 0.6s ease;
        }

        .hotel-banner p {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--banner-text);
            transition: color 0.6s ease;
        }

        .hotel-banner a {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 900;
            font-size: 18px;
            transition: color 0.6s ease;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .card-label {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card-label input[type="radio"] {
            display: none;
        }

        .card {
            border: 2px solid var(--card-border);
            border-radius: 18px;
            padding: 18px;
            background: var(--card-inner-bg);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-label input[type="radio"]:checked + .card {
            border-color: var(--primary-color);
            background-color: var(--card-checked-bg);
            box-shadow: 0 5px 15px var(--card-checked-shadow);
        }

        .card h4 {
            margin: 0 0 10px 0;
            font-size: 17px;
            font-weight: 900;
            color: var(--card-heading);
            transition: color 0.6s ease;
        }

        .card p {
            margin: 6px 0;
            font-size: 14px;
            color: var(--card-text);
            transition: color 0.6s ease;
        }

        .price {
            font-size: 16px !important;
            font-weight: 900;
            color: var(--primary-color) !important;
            margin-top: 12px !important;
            background: var(--card-inner-bg);
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
            border: 1px dashed var(--primary-color);
            transition: all 0.6s ease;
        }

        .submit-btn {
            width: 100%;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            font-family: inherit;
            border-radius: 20px;
            margin-top: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            background: var(--btn-hover);
        }
        
        .submit-btn:disabled {
            background: #444;
            color: #777;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <!-- Header GIFs -->
    <div class="gif-wrapper header-gifs">
        <img id="gif1" src="https://i.giphy.com/media/26AHONQ79FdWZhAIw/giphy.gif" alt="Cat 1">
        <img id="gif2" src="https://i.giphy.com/media/3o6ZsW4XzMcebhkU2k/giphy.gif" alt="Cat 2">
    </div>

    <div class="container">
        <h1 id="main_title">მოწვეული ხარ ანდროს დაბადების დღის გაგულავებაზე! სგსგ გილოცავ 🥳🐱</h1>

        <form id="inviteForm">
            
            <div class="toggle-container">
                <label>
                    <input type="radio" name="guestType" value="solo" onchange="toggleGuestMode()">
                    <span>მარტო 👤</span>
                </label>
                <label>
                    <input type="radio" name="guestType" value="couple" onchange="toggleGuestMode()" checked>
                    <span>წყვილი 👥</span>
                </label>
            </div>

            <h3 id="h3_1">🌸 პირველი სტუმარი</h3>
            <div class="input-group">
                <input type="text" id="g1_name" placeholder="სახელი" required>
                <input type="text" id="g1_surname" placeholder="გვარი" required>
            </div>

            <div id="guest2_section">
                <h3>🎀 მეორე სტუმარი</h3>
                <div class="input-group">
                    <input type="text" id="g2_name" placeholder="სახელი">
                    <input type="text" id="g2_surname" placeholder="გვარი">
                </div>
            </div>

            <div class="hotel-banner">
                <p>🏨 ჩვენი ლოკაცია ანტალიაში:</p>
                <a href="https://www.google.com/travel/search?q=FALCON+HOTEL+Antalya" target="_blank">🌟 Falcon Hotel, Antalya</a>
            </div>

            <h3>✈️ აირჩიეთ თქვენი ვარიანტი:</h3>
            <div class="cards-container">
                <label class="card-label">
                    <input type="radio" name="itinerary" value="28 ოქტ - 31 ოქტ (3 ღამე)" required>
                    <div class="card">
                        <h4>28 ოქტ – 31 ოქტ (3 ღამე)</h4>
                        <p>🛫 <b>გაფრენა:</b> 06:50 (Pegasus)</p>
                        <p>🛬 <b>დაბრუნება:</b> 22:45 (SunExpress, პირდაპირი)</p>
                        <p class="price" id="price_option1">ჯამი: ~2,800 ₾ (20კგ ბარგით)</p>
                    </div>
                </label>

                <label class="card-label">
                    <input type="radio" name="itinerary" value="28 ოქტ - 1 ნოემ (4 ღამე)">
                    <div class="card">
                        <h4>28 ოქტ – 1 ნოემ (4 ღამე)</h4>
                        <p>🛫 <b>გაფრენა:</b> 06:50 (Pegasus)</p>
                        <p>🛬 <b>დაბრუნება:</b> 21:25 (AJet, 1 გადაჯდომა)</p>
                        <p class="price" id="price_option2">ჯამი: ~3,150 ₾ (20კგ ბარგით)</p>
                    </div>
                </label>
            </div>

            <button type="button" class="submit-btn" id="submitBtn" onclick="sendData()">წავედით 🐾</button>
        </form>
    </div>

    <!-- Footer GIFs -->
    <div class="gif-wrapper footer-gifs">
        <img id="gif3" src="https://i.giphy.com/media/13HBDT4QSTpveU/giphy.gif" alt="Cat 3">
        <img id="gif4" src="https://i.giphy.com/media/l4pTfx2qLszoacZRS/giphy.gif" alt="Cat 4">
    </div>

    <script>
        // URLs for Happy Mode
        const happyGifs = [
            "https://i.giphy.com/media/26AHONQ79FdWZhAIw/giphy.gif",
            "https://i.giphy.com/media/3o6ZsW4XzMcebhkU2k/giphy.gif",
            "https://i.giphy.com/media/13HBDT4QSTpveU/giphy.gif",
            "https://i.giphy.com/media/l4pTfx2qLszoacZRS/giphy.gif"
        ];

        // URLs for Sad Mode
        const sadGifs = [
            "https://i.giphy.com/media/qQdL532ZANbjy/giphy.gif",
            "https://i.giphy.com/media/L95W4wv8nnb9K/giphy.gif",
            "https://i.giphy.com/media/3o6fJ2J2Ct3zcv1u7K/giphy.gif",
            "https://i.giphy.com/media/Y4z9olnoVl5QI/giphy.gif"
        ];

        function toggleGuestMode() {
            const guestType = document.querySelector('input[name="guestType"]:checked').value;
            const isSolo = (guestType === 'solo');
            
            const body = document.body;
            const guest2Section = document.getElementById('guest2_section');
            const price1 = document.getElementById('price_option1');
            const price2 = document.getElementById('price_option2');
            const mainTitle = document.getElementById('main_title');
            const h3_1 = document.getElementById('h3_1');
            const submitBtn = document.getElementById('submitBtn');

            const gif1 = document.getElementById('gif1');
            const gif2 = document.getElementById('gif2');
            const gif3 = document.getElementById('gif3');
            const gif4 = document.getElementById('gif4');

            if (isSolo) {
                // Apply Dark/Sad Theme
                body.classList.add('solo-theme');
                guest2Section.classList.add('hidden');
                
                document.getElementById('g2_name').value = '';
                document.getElementById('g2_surname').value = '';
                
                price1.innerText = 'ჯამი: ~2,050 ₾ (20კგ ბარგით)';
                price2.innerText = 'ჯამი: ~2,400 ₾ (20კგ ბარგით)';
                
                mainTitle.innerText = 'მარტო მიდიხარ? რატომ... 😿🌧️';
                h3_1.innerText = 'მარტოსული სტუმარი 🥀';
                submitBtn.innerText = 'მარტო წავალ... 🌧️';

                gif1.src = sadGifs[0];
                gif2.src = sadGifs[1];
                gif3.src = sadGifs[2];
                gif4.src = sadGifs[3];

            } else {
                // Revert to Happy/Couple Theme
                body.classList.remove('solo-theme');
                guest2Section.classList.remove('hidden');
                
                price1.innerText = 'ჯამი: ~2,800 ₾ (20კგ ბარგით)';
                price2.innerText = 'ჯამი: ~3,150 ₾ (20კგ ბარგით)';
                
                mainTitle.innerText = 'მოწვეული ხარ ანდროს დაბადების დღის გაგულავებაზე! სგსგ გილოცავ 🥳🐱';
                h3_1.innerText = '🌸 პირველი სტუმარი';
                submitBtn.innerText = 'წავედით 🐾';

                gif1.src = happyGifs[0];
                gif2.src = happyGifs[1];
                gif3.src = happyGifs[2];
                gif4.src = happyGifs[3];
            }
        }

        // Telegram Bot integration
        const BOT_TOKEN = "8903520484:AAFb70VAHr3hlzG0D4tAj6nHja_fXp3Um7g"; 
        const CHAT_ID = "1506934904"; 

        async function sendData() {
            const btn = document.getElementById('submitBtn');
            const guestType = document.querySelector('input[name="guestType"]:checked').value;
            const isSolo = (guestType === 'solo');
            const g1Name = document.getElementById('g1_name').value.trim();
            const g1Surname = document.getElementById('g1_surname').value.trim();
            const g2Name = document.getElementById('g2_name').value.trim();
            const g2Surname = document.getElementById('g2_surname').value.trim();
            
            if (!g1Name || !g1Surname) {
                alert(isSolo ? 'გთხოვთ, შეავსოთ თქვენი მონაცემები... მარტოც რომ იყოთ 🌧️' : 'გთხოვთ, შეავსოთ პირველი სტუმრის სახელი და გვარი. 😿');
                return;
            }

            if (!isSolo && (!g2Name || !g2Surname)) {
                alert('გთხოვთ, შეავსოთ მეორე სტუმრის მონაცემები, ან აირჩიოთ "მარტო". 🎀');
                return;
            }

            const selectedOption = document.querySelector('input[name="itinerary"]:checked');
            if (!selectedOption) {
                alert(isSolo ? 'გთხოვთ, აირჩიოთ ვარიანტი მაინც... 🥀' : 'გთხოვთ, აირჩიოთ სასურველი ვარიანტი. 🎀');
                return;
            }

            btn.disabled = true;
            btn.innerText = isSolo ? "მიგზავნის... ⏳" : "იგზავნება... ⏳";

            let messageBody = isSolo ? `🌧️ ახალი დასტური (მარტო მოდის)...\n\n` : `🎉 ახალი დასტური ტურზე!\n\n`;
            messageBody += `🧳 ფორმატი: ${isSolo ? 'მარტო მიდის' : 'წყვილი მოდის'}\n`;
            messageBody += `👤 ${isSolo ? 'მარტოსული' : 'პირველი სტუმარი'}: ${g1Name} ${g1Surname}\n`;
            
            if (!isSolo) {
                messageBody += `👥 მეორე სტუმარი: ${g2Name} ${g2Surname}\n`;
            }
            
            messageBody += `🗓 არჩეული ვარიანტი: ${selectedOption.value}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: messageBody
                    })
                });

                if (response.ok) {
                    alert(isSolo ? 'გაიგზავნა... შევხვდებით ანტალიაში 🌧️' : 'მონაცემები წარმატებით გაიგზავნა! შევხვდებით ანტალიაში 🏖️🐾');
                    btn.innerText = isSolo ? "მადლობა 🥀" : "მადლობა 💖";
                    btn.disabled = true;
                } else {
                    alert('დაფიქსირდა შეცდომა. გთხოვთ სცადოთ მოგვიანებით. 😿');
                    btn.innerText = isSolo ? "მარტო წავალ... 🌧️" : "წავედით 🐾";
                    btn.disabled = false;
                }
            } catch (error) {
                alert('კავშირის შეცდომა. გთხოვთ შეამოწმოთ ინტერნეტი. 🔌');
                btn.innerText = isSolo ? "მარტო წავალ... 🌧️" : "წავედით 🐾";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
