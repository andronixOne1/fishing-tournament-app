<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ანდროს დაბადების დღე 🎂</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --primary-color: #6eb5ff; /* Sky Blue */
            --secondary-color: #ffda75; /* Pastel Yellow Accent */
            --bg-gradient: linear-gradient(135deg, #fff9d2 0%, #d4f0ff 100%); /* Yellow to Blue */
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-color: #555555;
            --border-radius: 25px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Mobile-Friendly GIF Containers (Fixed links) */
        .gif-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 420px;
            pointer-events: none;
            z-index: 10;
        }

        .header-gifs {
            margin-bottom: -15px; 
        }

        .footer-gifs {
            margin-top: -15px;
        }

        .gif-wrapper img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
        }

        .gif-wrapper img:nth-child(even) {
            animation-delay: 1.5s;
            animation-direction: reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .container {
            background-color: var(--card-bg);
            max-width: 420px;
            width: 100%;
            padding: 30px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(110, 181, 255, 0.2);
            border: 3px solid #ffffff;
            position: relative;
            z-index: 20;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            margin-top: 5px;
            line-height: 1.4;
        }

        /* Toggle Switch for Solo/Couple */
        .toggle-container {
            display: flex;
            background-color: #f0f8ff;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #d4f0ff;
            margin-bottom: 20px;
        }

        .toggle-container label {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            color: #888;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-container input[type="radio"] {
            display: none;
        }

        .toggle-container input[type="radio"]:checked + span {
            color: var(--primary-color);
        }
        
        .toggle-container label:has(input[type="radio"]:checked) {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(110, 181, 255, 0.2);
        }

        h3 {
            font-size: 16px;
            font-weight: 900;
            margin-top: 20px;
            margin-bottom: 12px;
            color: #ffc233;
            padding-bottom: 5px;
            border-bottom: 2px dashed #ffeda3;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e6f4ff;
            background-color: #f7fcff;
            border-radius: 15px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(110, 181, 255, 0.3);
        }

        input::placeholder {
            color: #a3d4ff;
        }

        #guest2_section {
            transition: all 0.3s ease;
        }

        /* Hotel Info Banner */
        .hotel-banner {
            background-color: #fffde6;
            border: 2px solid #fff3a3;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
            transition: transform 0.2s;
        }

        .hotel-banner:hover {
            transform: scale(1.02);
        }

        .hotel-banner p {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 700;
            color: #d69e00;
        }

        .hotel-banner a {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 900;
            font-size: 18px;
        }

        /* Card Styles */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .card-label {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card-label input[type="radio"] {
            display: none;
        }

        .card {
            border: 2px solid #f0f0f0;
            border-radius: 18px;
            padding: 18px;
            background: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-label input[type="radio"]:checked + .card {
            border-color: var(--primary-color);
            background-color: #f2faff;
            box-shadow: 0 5px 15px rgba(110, 181, 255, 0.25);
        }

        .card-label input[type="radio"]:checked + .card::after {
            content: '✨';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
        }

        .card h4 {
            margin: 0 0 10px 0;
            font-size: 17px;
            font-weight: 900;
            color: #444;
        }

        .card p {
            margin: 6px 0;
            font-size: 14px;
            color: #666;
        }

        .price {
            font-size: 16px !important;
            font-weight: 900;
            color: var(--primary-color) !important;
            margin-top: 12px !important;
            background: #ffffff;
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
            border: 1px dashed var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            font-family: inherit;
            border-radius: 20px;
            margin-top: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(110, 181, 255, 0.4);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(110, 181, 255, 0.5);
            background: #5baaff;
        }
        
        .submit-btn:active:not(:disabled) {
            transform: translateY(2px);
        }
        
        .submit-btn:disabled {
            background: #e0e0e0;
            box-shadow: none;
            cursor: not-allowed;
            color: #999;
            transform: none;
        }
    </style>
</head>
<body>

    <!-- Header GIFs (Reliable Tenor links) -->
    <div class="gif-wrapper header-gifs">
        <img src="https://media.tenor.com/2RoLBx_H4eMAAAAi/peach-cat.gif" alt="Cute Cat">
        <img src="https://media.tenor.com/b-rR_T0H0G8AAAAi/happy-birthday.gif" alt="Birthday">
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1>მოწვეული ხარ ანდროს დაბადების დღის გაგულავებაზე! სგსგ გილოცავ 🥳🐱</h1>

        <form id="inviteForm">
            
            <!-- Solo / Couple Toggle -->
            <div class="toggle-container">
                <label>
                    <input type="radio" name="guestType" value="solo" onchange="toggleGuestMode()">
                    <span>მარტო 👤</span>
                </label>
                <label>
                    <input type="radio" name="guestType" value="couple" onchange="toggleGuestMode()" checked>
                    <span>წყვილი 👥</span>
                </label>
            </div>

            <h3>🌸 პირველი სტუმარი</h3>
            <div class="input-group">
                <input type="text" id="g1_name" placeholder="სახელი" required>
                <input type="text" id="g1_surname" placeholder="გვარი" required>
            </div>

            <div id="guest2_section">
                <h3>🎀 მეორე სტუმარი</h3>
                <div class="input-group">
                    <input type="text" id="g2_name" placeholder="სახელი">
                    <input type="text" id="g2_surname" placeholder="გვარი">
                </div>
            </div>

            <div class="hotel-banner">
                <p>🏨 ჩვენი ლოკაცია ანტალიაში:</p>
                <a href="https://www.google.com/travel/search?q=FALCON+HOTEL+Antalya" target="_blank">🌟 Falcon Hotel, Antalya</a>
            </div>

            <h3>✈️ აირჩიეთ თქვენი ვარიანტი:</h3>
            <div class="cards-container">
                <label class="card-label">
                    <input type="radio" name="itinerary" value="28 ოქტ - 31 ოქტ (3 ღამე)" required>
                    <div class="card">
                        <h4>28 ოქტ – 31 ოქტ (3 ღამე)</h4>
                        <p>🛫 <b>გაფრენა:</b> 06:50 (Pegasus)</p>
                        <p>🛬 <b>დაბრუნება:</b> 22:45 (SunExpress, პირდაპირი)</p>
                        <p class="price" id="price_option1">ჯამი: ~2,800 ₾ (20კგ ბარგით)</p>
                    </div>
                </label>

                <label class="card-label">
                    <input type="radio" name="itinerary" value="28 ოქტ - 1 ნოემ (4 ღამე)">
                    <div class="card">
                        <h4>28 ოქტ – 1 ნოემ (4 ღამე)</h4>
                        <p>🛫 <b>გაფრენა:</b> 06:50 (Pegasus)</p>
                        <p>🛬 <b>დაბრუნება:</b> 21:25 (AJet, 1 გადაჯდომა)</p>
                        <p class="price" id="price_option2">ჯამი: ~3,150 ₾ (20კგ ბარგით)</p>
                    </div>
                </label>
            </div>

            <button type="button" class="submit-btn" id="submitBtn" onclick="sendData()">წავედით 🐾</button>
        </form>
    </div>

    <!-- Footer GIFs -->
    <div class="gif-wrapper footer-gifs">
        <img src="https://media.tenor.com/fOszG4B1YNEAAAAi/mochi-peach-cat.gif" alt="Mochi Cat">
        <img src="https://media.tenor.com/H1X1Jm_tM9kAAAAi/cat-dance.gif" alt="Dancing Cat">
    </div>

    <script>
        // Toggle Logic for Solo/Couple mode
        function toggleGuestMode() {
            const guestType = document.querySelector('input[name="guestType"]:checked').value;
            const guest2Section = document.getElementById('guest2_section');
            const price1 = document.getElementById('price_option1');
            const price2 = document.getElementById('price_option2');

            if (guestType === 'solo') {
                guest2Section.style.display = 'none';
                // Reset guest 2 fields so they don't get sent accidentally
                document.getElementById('g2_name').value = '';
                document.getElementById('g2_surname').value = '';
                // Prices updated for 1 flight ticket + baggage (Hotel room stays full price)
                price1.innerText = 'ჯამი: ~2,050 ₾ (20კგ ბარგით)';
                price2.innerText = 'ჯამი: ~2,400 ₾ (20კგ ბარგით)';
            } else {
                guest2Section.style.display = 'block';
                // Prices reverted for 2 flight tickets + 2 baggages
                price1.innerText = 'ჯამი: ~2,800 ₾ (20კგ ბარგით)';
                price2.innerText = 'ჯამი: ~3,150 ₾ (20კგ ბარგით)';
            }
        }

        // Telegram Bot integration
        const BOT_TOKEN = "8903520484:AAFb70VAHr3hlzG0D4tAj6nHja_fXp3Um7g"; 
        const CHAT_ID = "1506934904"; 

        async function sendData() {
            const btn = document.getElementById('submitBtn');
            const guestType = document.querySelector('input[name="guestType"]:checked').value;
            const g1Name = document.getElementById('g1_name').value.trim();
            const g1Surname = document.getElementById('g1_surname').value.trim();
            const g2Name = document.getElementById('g2_name').value.trim();
            const g2Surname = document.getElementById('g2_surname').value.trim();
            
            if (!g1Name || !g1Surname) {
                alert('გთხოვთ, შეავსოთ პირველი სტუმრის სახელი და გვარი. 😿');
                return;
            }

            if (guestType === 'couple' && (!g2Name || !g2Surname)) {
                alert('გთხოვთ, შეავსოთ მეორე სტუმრის მონაცემები, ან აირჩიოთ "მარტო". 🎀');
                return;
            }

            const selectedOption = document.querySelector('input[name="itinerary"]:checked');
            if (!selectedOption) {
                alert('გთხოვთ, აირჩიოთ სასურველი ვარიანტი. 🎀');
                return;
            }

            // Disable button to prevent double clicks and show loading state
            btn.disabled = true;
            btn.innerText = "იგზავნება... ⏳";

            let messageBody = `🎉 ახალი დასტური ტურზე!\n\n`;
            messageBody += `🧳 ფორმატი: ${guestType === 'solo' ? 'მარტო მიდის' : 'წყვილი მოდის'}\n`;
            messageBody += `👤 პირველი სტუმარი: ${g1Name} ${g1Surname}\n`;
            
            if (guestType === 'couple') {
                messageBody += `👥 მეორე სტუმარი: ${g2Name} ${g2Surname}\n`;
            }
            
            messageBody += `🗓 არჩეული ვარიანტი: ${selectedOption.value}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: messageBody
                    })
                });

                if (response.ok) {
                    alert('მონაცემები წარმატებით გაიგზავნა! შევხვდებით ანტალიაში 🏖️🐾');
                    // Change button to "მადლობა" and leave it disabled
                    btn.innerText = "მადლობა 💖";
                    btn.disabled = true;
                } else {
                    alert('დაფიქსირდა შეცდომა. გთხოვთ სცადოთ მოგვიანებით. 😿');
                    btn.innerText = "წავედით 🐾";
                    btn.disabled = false;
                }
            } catch (error) {
                alert('კავშირის შეცდომა. გთხოვთ შეამოწმოთ ინტერნეტი. 🔌');
                btn.innerText = "წავედით 🐾";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
